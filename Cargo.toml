[package]
name = "tasktree"
version = "0.1.0"
edition = "2024"
resolver = "3"
authors = ["greygoo <21207197+IGreyGooI@users.noreply.github.com>"]
description = "An async behavior tree runtime for Rust — nodes are async functions or structs, state is shared through a typed blackboard, trees can be composed via a fluent builder API or loaded from YAML."
license = "MIT OR Apache-2.0"
repository = "https://github.com/IGreyGooI/tasktree"
keywords = ["behavior-tree", "async", "robotics", "ai", "game"]
categories = ["asynchronous", "game-engines"]

[features]
default = ["serde", "watch"]
serde   = ["dep:typetag", "dep:serde", "dep:serde_json", "dep:serde_norway"]
watch   = ["tokio/sync"]
lua     = ["dep:mlua", "serde"]

[dependencies]
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time"] }
tokio-util = { version = "0.7" }
async-trait = "0.1"
tracing = "0.1"
thiserror = "2.0"
scc = "3.1"
inventory = "0.3"

# serde feature deps
typetag = { version = "0.2", optional = true }
serde = { version = "1", features = ["derive", "rc"], optional = true }
serde_json = { version = "1", optional = true }
serde_norway = { version = "0.9", optional = true }

# lua feature deps
mlua = { version = "0.11", features = ["lua55", "vendored", "async", "send", "serde"], optional = true }


[dev-dependencies]
tokio = { version = "1", features = ["full"] }